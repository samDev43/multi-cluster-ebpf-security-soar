apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: shell-execution-monitor
spec:
  kprobes:
    - call: "security_bprm_creds_from_file"
      syscall: false
      args:
        - index: 0
          type: "nop"
        - index: 1
          type: "file"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Equal"
              values:
                - "/bin/busybox"
          matchActions:
            - action: Post
